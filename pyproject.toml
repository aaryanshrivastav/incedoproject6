[project]
name = "kb"
version = "0.1.0"
description = "Enterprise GenAI Knowledge Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "beautifulsoup4",
    "fastapi",
    "lxml",
    "openpyxl",
    "pdfplumber",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "pytesseract",
    "python-docx",
    "redis",
    "sqlalchemy[asyncio]",
    "typer",
    "uvicorn",
]

[project.scripts]
kb = "kb.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pillow",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "reportlab",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pytesseract.*",
    "openpyxl.*",
    "docx.*",
    "pdfplumber.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests requiring real Postgres and Redis containers",
    "requires_tesseract: tests requiring local tesseract binary",
]
